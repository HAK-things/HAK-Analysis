*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#142033;font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), video=$('video');
let metrics=[], selectedMetrics=new Set(), sign='', actions=[], clipStart=null, sourceFile=null, generated=new Map(), playlist=[], playlistIndex=0, importedPackages=new Set();
function enterAnalysisMode(){if(window.innerWidth<900)return alert('Analysis Mode is designed for a computer or a larger screen.');document.body.classList.add('team-analysis-mode');window.scrollTo(0,0);const root=document.documentElement,request=root.requestFullscreen||root.webkitRequestFullscreen;if(request){try{const result=request.call(root);if(result?.catch)result.catch(()=>{})}catch(_){}}}
function exitAnalysisMode(){document.body.classList.remove('team-analysis-mode');const exit=document.exitFullscreen||document.webkitExitFullscreen;if((document.fullscreenElement||document.webkitFullscreenElement)&&exit){try{const result=exit.call(document);if(result?.catch)result.catch(()=>{})}catch(_){}}}
function syncAnalysisFullscreen(){if(!document.fullscreenElement&&!document.webkitFullscreenElement&&document.body.classList.contains('team-analysis-mode'))document.body.classList.remove('team-analysis-mode')}
document.addEventListener('fullscreenchange',syncAnalysisFullscreen);document.addEventListener('webkitfullscreenchange',syncAnalysisFullscreen);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('team-analysis-mode'))exitAnalysisMode()});
const fmt=s=>{s=Math.max(0,Number(s)||0);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=Math.floor(s%60);return(h?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function renderMetrics(){const counts={};metrics.forEach(m=>counts[m]={p:0,n:0});actions.forEach(a=>a.metrics.forEach(m=>{if(counts[m]&&a.sign==='positive')counts[m].p++;if(counts[m]&&a.sign==='negative')counts[m].n++}));$('metrics').innerHTML=metrics.map(m=>`<button class="metric ${selectedMetrics.has(m)?'selected':''}" data-metric="${esc(m)}">${esc(m)}<span class="counts">+${counts[m].p} / −${counts[m].n}</span></button>`).join('')||'<div class="empty">Add your first metric</div>';$('metricFilter').innerHTML='<option value="">All metrics</option>'+metrics.map(m=>`<option>${esc(m)}</option>`).join('');$('selectionText').textContent=selectedMetrics.size?'Selected: '+[...selectedMetrics].join(', '):'No selected metrics'}
function sourceLabel(match={},fallback='Project'){return [match.team,match.opponent,match.date].filter(Boolean).join(' – ')||fallback}
function refreshProjectFilter(){const current=$('projectFilter').value,projects=[...new Set(actions.map(a=>a.project).filter(Boolean))];$('projectFilter').innerHTML='<option value="">All projects</option>'+projects.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('');if(projects.includes(current))$('projectFilter').value=current}
function filtered(){const p=$('projectFilter').value,m=$('metricFilter').value,s=$('signFilter').value;return actions.filter(a=>(!p||a.project===p)&&(!m||a.metrics.includes(m))&&(!s||(s==='none'?!a.sign:a.sign===s)))}
function resultPill(a){return a.sign==='positive'?'<span class="pill pos">POSITIVE</span>':a.sign==='negative'?'<span class="pill neg">NEGATIVE</span>':''}
function render(){renderMetrics();refreshProjectFilter();const rows=filtered();$('log').innerHTML=rows.map((a,i)=>`<tr><td class="no-print"><input class="check action-check" type="checkbox" data-id="${a.id}" ${a.selected?'checked':''}></td><td>${actions.indexOf(a)+1}</td><td>${esc(a.project||'Current project')}</td><td><button class="btn seek-action" data-time="${a.start}">${fmt(a.start)}</button></td><td>${fmt(a.end)}</td><td>${(a.end-a.start).toFixed(1)}s</td><td>${a.metrics.map(m=>`<span class="pill metric-pill">${esc(m)}</span>`).join('')}</td><td>${resultPill(a)}</td><td>${esc(a.note||'—')}</td><td class="no-print"><div class="row-actions"><button class="btn move-up" data-id="${a.id}" title="Move up">↑</button><button class="btn move-down" data-id="${a.id}" title="Move down">↓</button><button class="btn play-one" data-id="${a.id}" ${generated.has(a.id)?'':'disabled'}>Play</button><button class="btn download-one" data-id="${a.id}">Download</button><button class="btn edit-one" data-id="${a.id}">Edit</button><button class="btn bad delete-one" data-id="${a.id}">Delete</button></div></td></tr>`).join('')||'<tr><td colspan="10" class="empty">No situations in Action Log</td></tr>';const p=actions.filter(a=>a.sign==='positive').length,n=actions.filter(a=>a.sign==='negative').length,assessed=p+n;$('totalCount').textContent=actions.length;$('posCount').textContent=p;$('negCount').textContent=n;$('ratio').textContent=assessed?Math.round(p/assessed*100)+'%':'0%';$('pdfMatch').textContent=[$('teamName').value,$('opponent').value,$('matchDate').value].filter(Boolean).join(' • ')}
function addMetric(){const m=$('metricInput').value.trim();if(!m)return;if(metrics.some(x=>x.toLowerCase()===m.toLowerCase()))return alert('This metric already exists.');metrics.push(m);$('metricInput').value='';render()}
function setSign(s){sign=sign===s?'':s;$('positive').classList.toggle('selected',sign==='positive');$('negative').classList.toggle('selected',sign==='negative');updateClipState()}

  $('pdfMetrics').innerHTML=metrics.map(m=>{const list=actions.filter(a=>a.metrics.includes(m)),p=list.filter(a=>a.sign==='positive').length,n=list.filter(a=>a.sign==='negative').length,assessed=p+n,rate=assessed?Math.round(p/assessed*100):0;return `<section style="break-inside:avoid;margin:18px 0 24px"><h2 style="margin:0 0 7px;border-bottom:2px solid #142033;padding-bottom:5px">${esc(m)}</h2><p><b>${list.length}</b> situations &nbsp; <span style="color:#087a38"><b>+${p}</b> positive</span> &nbsp; <span style="color:#b42318"><b>−${n}</b> negative</span> &nbsp; <b>${rate}%</b> positive</p><table style="width:100%;min-width:0"><thead><tr><th>#</th><th>Start</th><th>End</th><th>Duration</th><th>Result</th><th>Coach note</th></tr></thead><tbody>${list.map((a,i)=>`<tr><td>${i+1}</td><td>${fmt(a.start)}</td><td>${fmt(a.end)}</td><td>${(a.end-a.start).toFixed(1)}s</td><td>${resultPill(a)}</td><td>${esc(a.note||'—')}</td></tr>`).join('')||'<tr><td colspan="6">No situations</td></tr>'}</tbody></table></section>`}).join('');
}
function moveAction(id,delta){const from=actions.findIndex(a=>a.id===id),to=from+delta;if(from<0||to<0||to>=actions.length)return;const [item]=actions.splice(from,1);actions.splice(to,0,item);render()}
function editAction(id){const a=actions.find(x=>x.id===id);if(!a)return;const names=prompt('Metrics separated by |',a.metrics.join(' | '));if(names===null)return;const parsed=names.split('|').map(x=>x.trim()).filter(Boolean);if(!parsed.length)return alert('At least one metric is required.');parsed.forEach(m=>{if(!metrics.includes(m))metrics.push(m)});const result=prompt('Result: positive, negative or leave blank',a.sign||'');if(result===null)return;const normalized=result.trim().toLowerCase();if(!['','positive','negative'].includes(normalized))return alert('Use positive, negative or leave blank.');const st=prompt('Start in seconds',a.start),en=prompt('End in seconds',a.end);if(st===null||en===null)return;const start=Number(st),end=Number(en);if(!Number.isFinite(start)||!Number.isFinite(end)||end<=start)return alert('Invalid start/end.');const note=prompt('Coach note',a.note||'');a.metrics=parsed;a.sign=normalized;a.start=start;a.end=end;a.note=note===null?a.note:note;a.edited=true;generated.delete(a.id);render()}
$('videoFile').onchange=e=>{sourceFile=e.target.files[0];if(!sourceFile)return;video.src=URL.createObjectURL(sourceFile);$('videoName').textContent=sourceFile.name;generated.clear();render()};video.ontimeupdate=()=>{$('currentTime').textContent=fmt(video.currentTime);if(video.duration)$('seek').value=Math.round(video.currentTime/video.duration*1000)};video.onloadedmetadata=()=>{$('duration').textContent=fmt(video.duration)};$('seek').oninput=e=>{if(video.duration)video.currentTime=Number(e.target.value)/1000*video.duration};
$('metrics').onclick=e=>{const b=e.target.closest('[data-metric]');if(!b)return;const m=b.dataset.metric;selectedMetrics.has(m)?selectedMetrics.delete(m):selectedMetrics.add(m);renderMetrics();updateClipState()};$('addMetric').onclick=addMetric;$('metricInput').onkeydown=e=>{if(e.key==='Enter')addMetric()};$('positive').onclick=()=>setSign('positive');$('negative').onclick=()=>setSign('negative');$('startClip').onclick=begin;$('endClip').onclick=end;$('cancelClip').onclick=cancel;const seekStep=()=>Number($('seekStep').value)||3,seekStepLabel=seconds=>seconds===90?'1:30':seconds+' sec',updateSeekButtons=()=>{const seconds=seekStep(),label=seekStepLabel(seconds);$('back3').textContent='−'+label;$('forward3').textContent='+'+label};$('seekStep').onchange=updateSeekButtons;$('back3').onclick=()=>video.currentTime=Math.max(0,video.currentTime-seekStep());$('forward3').onclick=()=>video.currentTime=Math.min(video.duration||Infinity,video.currentTime+seekStep());updateSeekButtons();
$('projectFilter').onchange=render;$('metricFilter').onchange=render;$('signFilter').onchange=render;$('selectVisible').onclick=()=>{filtered().forEach(a=>a.selected=true);render()};$('clearSelection').onclick=()=>{actions.forEach(a=>a.selected=false);render()};$('generateClips').onclick=generate;$('generateClipsTop').onclick=generate;$('playSelected').onclick=()=>openPlaylist(actions.filter(a=>a.selected));$('playAllGenerated').onclick=playAllGenerated;$('downloadSelected').onclick=downloadSelectedClips;$('gkaBtn').onclick=exportTMA;$('csvBtn').onclick=exportCSV;$('pdfBtn').onclick=()=>{render();buildPDF();window.print()};$('addTmaBtn').onclick=()=>$('addTmaFile').click();$('addTmaFile').onchange=async e=>{try{await addTMAFiles(e.target.files)}catch(err){alert('Add TMA error: '+err.message)}e.target.value=''};
$('analysisModeBtn').onclick=enterAnalysisMode;$('analysisModeExit').onclick=exitAnalysisMode;
$('log').onclick=e=>{const id=e.target.dataset.id,a=actions.find(x=>x.id===id);if(e.target.classList.contains('move-up'))moveAction(id,-1);if(e.target.classList.contains('move-down'))moveAction(id,1);if(e.target.classList.contains('play-one'))openPlaylist(actions.filter(x=>x.id===id));if(e.target.classList.contains('download-one')&&a)downloadOneAction(a);if(e.target.classList.contains('edit-one'))editAction(id);if(e.target.classList.contains('delete-one')&&confirm('Delete this situation?')){actions=actions.filter(x=>x.id!==id);generated.delete(id);render()}if(e.target.classList.contains('seek-action')){video.currentTime=Number(e.target.dataset.time);video.scrollIntoView({behavior:'smooth',block:'center'})}};$('log').onchange=e=>{if(e.target.classList.contains('action-check')){const a=actions.find(x=>x.id===e.target.dataset.id);if(a)a.selected=e.target.checked}};
$('closePlayer').onclick=()=>{$('playlistVideo').pause();$('playerOverlay').style.display='none'};$('prevClip').onclick=()=>{playlistIndex=(playlistIndex-1+playlist.length)%playlist.length;loadPlaylist()};$('nextClip').onclick=()=>{playlistIndex=(playlistIndex+1)%playlist.length;loadPlaylist()};$('playlistVideo').onended=()=>{if(playlistIndex<playlist.length-1){playlistIndex++;loadPlaylist()}};
document.onkeydown=e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();video.paused?video.play():video.pause()}if(e.key==='ArrowLeft')video.currentTime=Math.max(0,video.currentTime-seekStep());if(e.key==='ArrowRight')video.currentTime=Math.min(video.duration||Infinity,video.currentTime+seekStep())};
render();updateClipState();
})();
</script>
</body>
</html>
